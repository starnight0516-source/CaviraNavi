name: Build CaviraNavi APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate project and Build Debug APK
        run: |
          PROJECT_DIR=$(dirname "$(find . -name "settings.gradle.kts" | head -n 1)")
          if [ -z "$PROJECT_DIR" ]; then
            echo "找不到 settings.gradle.kts，目前檔案結構如下："
            find . -maxdepth 3
            exit 1
          fi
          echo "找到專案目錄：$PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/CaviraNavi-6350.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CaviraNavi-6350-APK
          path: CaviraNavi-6350.apk
